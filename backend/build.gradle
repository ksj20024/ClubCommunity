plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.club_community'
version = '0.0.1-SNAPSHOT'
description = 'club_community_backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
    implementation(platform("io.awspring.cloud:spring-cloud-aws-dependencies:4.0.2"))
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3'
    implementation 'com.deepoove:poi-tl:1.12.2'
    constraints {
        // 보안 경고가 뜨는 하위 라이브러리들을 강제로 최신화
        implementation('org.apache.poi:poi:5.4.0') {
            because 'security vulnerability in older versions'
        }
        implementation('org.apache.poi:poi-ooxml:5.4.0') {
            because 'security vulnerability in older versions'
        }
        implementation('org.apache.commons:commons-compress:1.28.0') {
            because 'CVE-2024-22306, CVE-2024-2092 등 보안 이슈 대응'
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
